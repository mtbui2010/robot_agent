# The goal kinds of the standard (household) pack. Step S05 gave each kind its rules object (reached / holds / missing:
# robot_agent/packs/household/callables/goals.py); Step S07 moved the rest of the old table here: needs, the understand prompt
# line, understood, planned_by, conflicts and the sub-goal phrase (core/planning/goals.py GOAL_KINDS, MANIPULATION,
# TEMPLATE_KINDS and subgoal_text at 814d212; tests/test_pack_goal_kinds.py proves this data equals them).
# The order is the order of the old GOAL_KINDS (on, in, open, close, go, say, deliver): it is the order of the kinds in the
# understand prompt and schema. `give` is not a kind here: it is the optional kind of goals.py OPTIONAL_KINDS, mapped to `on`
# before any rule reads it. "on" and "in" are quoted: YAML 1.1 reads a bare `on` as true.
# understood: always = MANIPULATION (in the model's enum even when the robot lacks the actions: understood, then refused).
# planned_by: template = TEMPLATE_KINDS (goals.compile_steps, no model). subgoal: the template language of
# robot_agent/core/pack/kind_table.py ({slot}, {slot:SEP}, [{?guard}A|B]); `[{?object}{object}]` is the old `object or ""`.
goal_kinds:
  "on":
    rules: std.on
    needs: [Pick, Place]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: '[{?hand}hand|put] the [{?object}{object}][{?from} (it is at {from})|{?from_any} (look for it at {from_any: or })] [{?hand}to {to}|on {to}]'
    source: "robot_agent/core/planning/goals.py:32-34 and :180-182 at 814d212 (MANIPULATION, GOAL_KINDS['on'], subgoal_text); rules: assist_loop.py:1279-1349 at 2d57c99"
  "in":
    rules: std.in
    needs: [Pick, [PutIn, Place]]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'put the [{?object}{object}][{?from} (it is at {from})|{?from_any} (look for it at {from_any: or })] into {to}'
    source: "robot_agent/core/planning/goals.py:32, :35 and :183-184 at 814d212 (MANIPULATION, GOAL_KINDS['in'], subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
  open:
    rules: std.open
    needs: [Open]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'open [{?object}{object}]'
    source: "robot_agent/core/planning/goals.py:32, :36 and :185-186 at 814d212 (MANIPULATION, GOAL_KINDS['open'], subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
  close:
    rules: std.close
    needs: [Close]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'close [{?object}{object}]'
    source: "robot_agent/core/planning/goals.py:32, :37 and :185-186 at 814d212 (MANIPULATION, GOAL_KINDS['close'], subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
  go:
    rules: std.go
    needs: [MoveTo]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"go" = only go somewhere, nothing to move: object "", from "", to = the place.'
    subgoal: 'go to {to}'
    source: "robot_agent/core/planning/goals.py:38-39, :47 and :187-188 at 814d212 (GOAL_KINDS['go'], TEMPLATE_KINDS, subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
  say:
    rules: std.say
    needs: [Say]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"say" = tell someone something: object = the sentence to say, as the robot should say it; from ""; to = the place to say it at, or the person, or "".'
    subgoal: 'say "[{?object}{object}]"[{?to} at {to}|{?person} at {person}]'
    source: "robot_agent/core/planning/goals.py:40-42, :47 and :189-191 at 814d212 (GOAL_KINDS['say'], TEMPLATE_KINDS, subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
  deliver:
    rules: std.deliver
    needs: [MoveTo, WaitForUnload]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"deliver" = take what the robot carries to a place and hand it over: object = the item (or ""), from "", to = the place.'
    subgoal: '[{?object}deliver the {object} to {to}|deliver what the robot carries to {to}]'
    source: "robot_agent/core/planning/goals.py:43-45, :47 and :192-193 at 814d212 (GOAL_KINDS['deliver'], TEMPLATE_KINDS, subgoal_text); rules: assist_loop.py:1290-1349 at 2d57c99"
