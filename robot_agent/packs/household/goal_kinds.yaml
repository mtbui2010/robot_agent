# The goal kinds of the standard (household) pack. Step S05 gave each kind its rules object (reached / holds / missing:
# robot_agent/packs/household/callables/goals.py); Step S07 adds needs, understood, planned_by, conflicts, prompt and subgoal
# (read by core/planning/goals.py through core/pack/goal_kinds.py), the values of goals.py GOAL_KINDS, MANIPULATION,
# TEMPLATE_KINDS and subgoal_text at 96c17e1, character for character (tests/test_pack_goal_kinds.py).
# The order is the order of the old GOAL_KINDS (on, in, open, close, go, say, deliver): it is the order of the kinds in the
# understand prompt and schema. `give` is not a kind here: it is the optional kind of goals.py OPTIONAL_KINDS, mapped to `on`
# before any rule reads it.
# subgoal: alternatives separated by `|`; the first whose guards {name?} hold (the slot is not empty) is used. Slots: object,
# src (" (it is at <from>)" / " (look for it at <a> or <b>)" / ""), to, who (to, else the goal's person, else ""), and any
# other field of the goal (hand, person, ...).
# observe (Step S12): the verifier that looks at a goal of the kind after the task (verifiers.yaml); null = none, the goal
# stays on the belief ("no sensor declared for it"). The old loop looked at on / in goals only (assist_loop.py:3048 at 9f1786d).
# "on" and "in" are quoted: YAML 1.1 reads a bare `on` as true.
goal_kinds:
  "on":
    rules: std.on
    observe: std.find_at_destination
    needs: [Pick, Place]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: '{hand?}hand the {object}{src} to {to}|put the {object}{src} on {to}'
    source: "robot_agent/core/planning/assist_loop.py:1279-1349 at 2d57c99 (_on_reached and the on branches of _missing, _reaches, _goals_hold); goals.py:33-34, :32, :180-182 at 96c17e1"
  "in":
    rules: std.in
    observe: std.find_at_destination
    needs: [Pick, [PutIn, Place]]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'put the {object}{src} into {to}'
    source: "robot_agent/core/planning/assist_loop.py:1290-1349 at 2d57c99 (the in branches of _missing, _reaches, _goals_hold); goals.py:35, :32, :183-184 at 96c17e1"
  open:
    rules: std.open
    observe: null
    needs: [Open]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'open {object}'
    source: "robot_agent/core/planning/assist_loop.py:1290-1349 at 2d57c99 (the open branches of _missing, _reaches, _goals_hold); goals.py:36, :32, :185-186 at 96c17e1"
  close:
    rules: std.close
    observe: null
    needs: [Close]
    understood: always
    planned_by: planner
    conflicts: default
    subgoal: 'close {object}'
    source: "robot_agent/core/planning/assist_loop.py:1290-1349 at 2d57c99 (the close branches of _missing, _reaches, _goals_hold); goals.py:37, :32, :185-186 at 96c17e1"
  go:
    rules: std.go
    observe: null
    needs: [MoveTo]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"go" = only go somewhere, nothing to move: object "", from "", to = the place.'
    subgoal: 'go to {to}'
    source: "robot_agent/core/planning/goals.py:47 TEMPLATE_KINDS and the template branches of assist_loop.py:1290-1349 at 2d57c99; goals.py:38-39, :187-188 at 96c17e1"
  say:
    rules: std.say
    observe: null
    needs: [Say]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"say" = tell someone something: object = the sentence to say, as the robot should say it; from ""; to = the place to say it at, or the person, or "".'
    subgoal: '{who?}say "{object}" at {who}|say "{object}"'
    source: "robot_agent/core/planning/goals.py:47 TEMPLATE_KINDS and the template branches of assist_loop.py:1290-1349 at 2d57c99; goals.py:40-42, :189-191 at 96c17e1"
  deliver:
    rules: std.deliver
    observe: null
    needs: [MoveTo, WaitForUnload]
    understood: capable
    planned_by: template
    conflicts: default
    prompt: '"deliver" = take what the robot carries to a place and hand it over: object = the item (or ""), from "", to = the place.'
    subgoal: '{object?}deliver the {object} to {to}|deliver what the robot carries to {to}'
    source: "robot_agent/core/planning/goals.py:47 TEMPLATE_KINDS and the template branches of assist_loop.py:1290-1349 at 2d57c99; goals.py:43-45, :192-193 at 96c17e1"
