# The standard (household) pack's phrases: the English sentences about places, objects, carrying and the Pick / MoveTo help questions.
# Moved character for character from core/planning/speech.py (CORE_PHRASES, the household keys, HELP_PICK, HELP_MOVE).
# Source label: the header of pack.yaml. The union of this file and the core pack's file, minus the dotted keys, is `speech.CORE_PHRASES`;
# no key is in both files.
phrases:
  q_where_put: {en: "Where should I put the {object}?", slots: [object]}
  q_which_drawer: {en: "Which drawer should I {verb}?", slots: [verb]}
  q_where_go: {en: "Where should I go?"}
  q_where_take: {en: "Where should I take it?"}
  q_what_say: {en: "What should I say?"}
  q_where_are_you: {en: "Where are you?"}
  q_where_is_person: {en: "Where is {person}?", slots: [person]}
  q_where_is: {en: "I couldn't find the {object}. Where is it?", slots: [object]}
  q_where_is_obj: {en: "Where is the {object}?", slots: [object]}
  q_where_is_here: {en: "I don't see the {object} here. Where is it?", slots: [object]}
  q_place_unknown: {en: "I could not find '{said}' on my map. Do you mean: {options}? Or tell me another place.", slots: [said, options]}
  q_where_bring: {en: "Where are you? Or where should I put it?"}
  q_where_in_home: {en: "Which room, or which piece of furniture, is it in?"}
  a_look_in_room: {en: "OK, I will look in the {room}.", slots: [room]}
  q_what_bring: {en: "What should I bring?"}
  rb_on: {en: "put the {object} on the {place}", slots: [object, place]}
  rb_on_from: {en: "put the {object} from the {source} on the {place}", slots: [object, source, place]}
  rb_in: {en: "put the {object} in the {place}", slots: [object, place]}
  rb_to_you: {en: "bring you the {object}", slots: [object]}
  rb_on_near_you: {en: "bring you the {object} and put it on the {place} next to you", slots: [object, place]}
  rb_on_near_person: {en: "bring the {object} to {person} and put it on the {place} next to them", slots: [object, person, place]}
  rb_hand_you: {en: "hand you the {object}", slots: [object]}
  rb_to_person: {en: "bring the {object} to {person}", slots: [object, person]}
  rb_hand_person: {en: "hand the {object} to {person}", slots: [object, person]}
  rb_open: {en: "open the {place}", slots: [place]}
  rb_close: {en: "close the {place}", slots: [place]}
  rb_go: {en: "go to the {place}", slots: [place]}
  rb_say: {en: "tell {person}: \"{text}\"", slots: [person, text]}
  rb_say_here: {en: "say \"{text}\"", slots: [text]}
  rb_say_at: {en: "say \"{text}\" in the {place}", slots: [text, place]}
  help.pick: {en: "Could you move it closer to the edge, then say yes?"}
  help.move: {en: "Is something in the way? Please clear the way and say yes."}
