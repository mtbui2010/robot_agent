[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "vla-train"
version = "0.1.0"
description = "init / run / resume / status / stop for a policy training inside the robot_agent training images (openpi, LeRobot)"
requires-python = ">=3.11"
dependencies = ["pyyaml"]

[project.scripts]
vla-train = "vla_train.cli:main"

[tool.setuptools]
packages = ["vla_train"]
